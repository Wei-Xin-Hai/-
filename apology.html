<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>致你的一封道歉</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #e8f5e9 0%, #f1f8e9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    max-width: 520px;
    width: 100%;
    border-radius: 20px;
    padding: 40px 28px;
    box-shadow: 0 8px 32px rgba(76, 175, 80, .18);
    text-align: center;
  }
  .emoji { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 22px; color: #2e7d32; margin-bottom: 20px; }
  .letter {
    font-size: 16px;
    line-height: 2;
    color: #444;
    background: #f7fbf7;
    border-radius: 12px;
    padding: 22px 18px;
    text-align: left;
    white-space: pre-wrap;
  }
  .sign { margin-top: 18px; text-align: right; color: #2e7d32; font-size: 15px; }
  .tip { margin-top: 22px; font-size: 12px; color: #9e9e9e; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🥺</div>
    <h1>再次为昨天影响到你的好心情说声抱歉</h1>
    <div class="letter">我也知道你所说的“排骨”是指“固排”的意思（从你给我的上一个留言中即可看出），但是你不能否认的是，有时候你所说的排骨就是说我瘦的意思。有时候在我们的聊天氛围中，我并不能很好的判断出你想表达哪种意思（昨天应该是我理解错了，对不起了）。我真的非常讨厌这个词，跟绿茶、毒妇、细狗是一样的侮辱程度，请你以后少说，谢谢你。</div>
    <div class="sign">—— 哈基海</div>
  </div>
</body>
</html>
